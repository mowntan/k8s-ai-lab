replicaCount: 1

image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

env:
  - name: OLLAMA_BASE_URL
    value: "http://ollama:11434"
  - name: WEBUI_AUTH
    value: "true"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chat.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  mountPath: /app/backend/data
  storageClass: ""
  existingClaim: ""
  size: 2Gi
  skipUninstall: true

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
