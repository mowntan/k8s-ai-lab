apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llama-cpp.fullname" . }}
  labels:
    {{- include "llama-cpp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llama-cpp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llama-cpp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.rpc.enabled }}
      initContainers:
        - name: discover-rpc-workers
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              SVC="{{ include "llama-cpp.fullname" . }}-rpc.{{ .Release.Namespace }}.svc.cluster.local"
              EXPECTED={{ len .Values.rpc.workers }}
              PORT={{ .Values.rpc.port }}
              echo "Waiting for $EXPECTED RPC workers via $SVC..."
              while true; do
                # Resolve all A records for the headless service
                IPS=$(nslookup "$SVC" 2>/dev/null | grep "Address:" | tail -n +2 | awk '{print $2}')
                COUNT=$(echo "$IPS" | grep -c .)
                if [ "$COUNT" -ge "$EXPECTED" ]; then
                  # Verify each worker is listening
                  READY=0
                  RPC_LIST=""
                  for IP in $IPS; do
                    echo | nc -w 1 "$IP" "$PORT" 2>/dev/null
                    rc=$?
                    if [ "$rc" -le 1 ]; then
                      READY=$((READY + 1))
                      if [ -n "$RPC_LIST" ]; then
                        RPC_LIST="${RPC_LIST},${IP}:${PORT}"
                      else
                        RPC_LIST="${IP}:${PORT}"
                      fi
                    fi
                  done
                  if [ "$READY" -ge "$EXPECTED" ]; then
                    echo "$RPC_LIST" > /shared/rpc-workers
                    echo "All $READY workers ready: $RPC_LIST"
                    exit 0
                  fi
                  echo "Only $READY/$EXPECTED workers ready, retrying..."
                else
                  echo "Found $COUNT/$EXPECTED workers in DNS, retrying..."
                fi
                sleep 3
              done
          volumeMounts:
            - name: shared
              mountPath: /shared
      {{- end }}
      containers:
        - name: llama-server
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              set -- --host 0.0.0.0 --port 8080 --model {{ .Values.model.path }} --ctx-size {{ .Values.model.contextSize }}
              {{- if .Values.model.name }}
              set -- "$@" --alias {{ .Values.model.name | quote }}
              {{- end }}
              {{- range .Values.model.extraArgs }}
              set -- "$@" {{ . }}
              {{- end }}
              {{- if .Values.rpc.enabled }}
              RPC_WORKERS=$(cat /shared/rpc-workers)
              set -- "$@" --rpc "$RPC_WORKERS"
              {{- end }}
              exec llama-server "$@"
          volumeMounts:
            - name: models
              mountPath: {{ .Values.persistence.models.mountPath }}
            {{- if .Values.rpc.enabled }}
            - name: shared
              mountPath: /shared
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ if .Values.rpc.enabled }}240{{ else }}60{{ end }}
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: models
          {{- if .Values.persistence.models.nfs.server }}
          nfs:
            server: {{ .Values.persistence.models.nfs.server }}
            path: {{ .Values.persistence.models.nfs.path }}
          {{- else }}
          hostPath:
            path: {{ .Values.persistence.models.hostPath }}
            type: DirectoryOrCreate
          {{- end }}
        {{- if .Values.rpc.enabled }}
        - name: shared
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
